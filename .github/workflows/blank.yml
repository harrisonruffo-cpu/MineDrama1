name: Build APK 1.1.6

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Locate and copy APK artifact
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} build_output/dono-do-morro-v1.1.6.apk \;
          ls -la build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dono-do-morro-v1.1.6-apk
          path: build_output/*.apk
          retention-days: 30

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} - Dono do Morro APK
          body: |
            ### Dono do Morro v1.1.6
            - Versão atualizada com link camuflado configurado para o Episódio 1.
            - Baixe o APK em anexo e instale no seu dispositivo Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
