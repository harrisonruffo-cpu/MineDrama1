name: Build APK 1.1.6

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration and Keystore
        run: |
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Locate and copy APK artifact
        run: |
          mkdir -p build_output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} build_output/dono-do-morro-v1.1.6.apk \;
          if [ ! -f "build_output/dono-do-morro-v1.1.6.apk" ]; then
            find . -type f -name "*.apk" -exec cp {} build_output/dono-do-morro-v1.1.6.apk \;
          fi
          echo "Generated APK files in build_output:"
          ls -lh build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dono-do-morro-v1.1.6-apk
          path: build_output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} - Dono do Morro APK
          body: |
            ### Dono do Morro v1.1.6
            - Versão atualizada com link camuflado configurado para o Episódio 1.
            - Baixe o arquivo APK em anexo e instale no seu dispositivo Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
